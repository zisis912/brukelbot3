[package]
name = "brukelbot3"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam = "0.8.4"
dotenvy = "0.15.7"
enum_discriminant = "1.0.1"
env_logger = "0.11.11"
poise = "0.6.2"
rand = "0.10.1"
regex = "1.12.3"
serenity = "0.12.5"
sqlx = { version = "0.9.0", features = ["runtime-tokio","sqlite","macros"] }
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
